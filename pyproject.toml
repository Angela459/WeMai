[project]
name = "wemai"
version = "0.1.0"
description = "WeChat bridge for MaiBot based on pywechat"
requires-python = ">=3.9,<3.14"
dependencies = [
    "Pillow>=9.0.0",
    "pywin32>=300",
    "psutil>=5.9.0",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "pywin32-ctypes>=0.2.2",
    "emoji>=2.14.1",
    "pycaw>=20240210",
    "sounddevice>=0.5.1",
    "soundfile>=0.13.1",
    "redis>=4.5.0",
    "aioredis>=2.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "requests>=2.28.0",
    "websockets>=11.0.0",
    "maim_message>=0.3.8",
    "datetime>=5.0",
    "python-dotenv>=1.0.0",
    "packaging>=24.0",
]

[tool.uv]
package = false
